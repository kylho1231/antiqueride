<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#087F5B"/>
  <!-- Circular Accent Halo -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F5B301" stroke-width="12" stroke-dasharray="16 12" opacity="0.35"/>
  <!-- Stylized Philippine Tricycle Silhouette & Road Wing -->
  <g fill="#FFFFFF" transform="translate(64, 96) scale(0.75)">
    <!-- Cabin Roof -->
    <path d="M 60 140 Q 200 80 380 90 L 440 200 L 80 200 Z" fill="#F5B301" />
    <!-- Cabin Frame & Sidecar -->
    <rect x="50" y="200" width="220" height="130" rx="20" fill="#FFFFFF"/>
    <!-- Cabin Window Cutout -->
    <rect x="80" y="215" width="160" height="65" rx="10" fill="#102A43"/>
    <!-- Motorcycle Body Front -->
    <path d="M 270 210 L 370 210 L 420 310 L 300 310 Z" fill="#E2E8F0"/>
    <!-- Handlebar & Headlight -->
    <rect x="360" y="160" width="15" height="50" rx="5" fill="#CBD5E1"/>
    <circle cx="395" cy="190" r="18" fill="#F5B301"/>
    <circle cx="395" cy="190" r="10" fill="#FFFFFF"/>
    <!-- Wheels -->
    <!-- Sidecar Wheel -->
    <circle cx="120" cy="350" r="55" fill="#102A43" stroke="#F5B301" stroke-width="10"/>
    <circle cx="120" cy="350" r="22" fill="#CBD5E1"/>
    <!-- Rear Motorcycle Wheel -->
    <circle cx="280" cy="350" r="55" fill="#102A43" stroke="#F5B301" stroke-width="10"/>
    <circle cx="280" cy="350" r="22" fill="#CBD5E1"/>
    <!-- Front Motorcycle Wheel -->
    <circle cx="430" cy="350" r="55" fill="#102A43" stroke="#F5B301" stroke-width="10"/>
    <circle cx="430" cy="350" r="22" fill="#CBD5E1"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANTIQUERIDE</text>
</svg>
