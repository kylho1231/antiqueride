<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#93C5FD" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle Radar / Dispatch GIS Grid -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="10 8" opacity="0.3"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="8 6" opacity="0.25"/>
  <circle cx="256" cy="240" r="50" fill="none" stroke="#93C5FD" stroke-width="2" opacity="0.2"/>

  <!-- Tricycle & Speed Glyph -->
  <g fill="#FFFFFF" transform="translate(64, 80) scale(0.75)" filter="url(#shadow)">
    <!-- Tricycle Roof Canopy -->
    <path d="M 60 140 Q 200 85 380 95 L 430 195 L 80 195 Z" fill="#93C5FD" />
    <!-- Passenger Cabin -->
    <rect x="50" y="195" width="220" height="135" rx="18" fill="#FFFFFF"/>
    <!-- Cabin Window -->
    <rect x="75" y="210" width="165" height="70" rx="12" fill="#0F172A"/>
    <!-- Motorcycle Chasis Front -->
    <path d="M 270 205 L 370 205 L 415 305 L 300 305 Z" fill="#E2E8F0"/>
    <!-- Handlebar & Headlight -->
    <rect x="360" y="155" width="14" height="50" rx="6" fill="#94A3B8"/>
    <circle cx="395" cy="185" r="18" fill="#60A5FA"/>
    <circle cx="395" cy="185" r="10" fill="#FFFFFF"/>
    <!-- Wheels -->
    <circle cx="120" cy="350" r="54" fill="#0F172A" stroke="#93C5FD" stroke-width="8"/>
    <circle cx="120" cy="350" r="20" fill="#CBD5E1"/>
    <circle cx="280" cy="350" r="54" fill="#0F172A" stroke="#93C5FD" stroke-width="8"/>
    <circle cx="280" cy="350" r="20" fill="#CBD5E1"/>
    <circle cx="425" cy="350" r="54" fill="#0F172A" stroke="#93C5FD" stroke-width="8"/>
    <circle cx="425" cy="350" r="20" fill="#CBD5E1"/>
  </g>

  <!-- App Title Brand -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ANTIQUERIDE</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#BFDBFE" text-anchor="middle" letter-spacing="4">SAN JOSE • PILOT</text>
</svg>
